    const VALID_ROUTES = ['overview', 'projects', 'experience', 'education', 'contact'];
    let currentRoute = 'overview';
    let currentLang = 'en';
    let currentProjectFilter = 'all';

    /**
     * Resolves initial route from URL hash or defaults to 'overview'.
     */
    function getRouteFromHash() {
      const hash = window.location.hash.replace('#', '').trim().toLowerCase();
      return VALID_ROUTES.includes(hash) ? hash : 'overview';
    }

    /**
     * Navigates cleanly to a dedicated page view and updates URL hash.
     */
    function navigateTo(route, event) {
      if (event) {
        event.preventDefault();
      }
      if (!VALID_ROUTES.includes(route)) {
        route = 'overview';
      }
      currentRoute = route;
      if (window.location.hash !== '#' + route) {
        window.history.pushState({ route }, '', '#' + route);
      }
      window.scrollTo({ top: 0, behavior: 'instant' });
      renderApp();
    }

    /**
     * Switches language between 'en' and 'fr' and re-renders active view immediately.
     */
    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      renderApp();
    }

    /**
     * Updates active filter tab on the Research & Projects page.
     */
    function setProjectFilter(filterId) {
      currentProjectFilter = filterId;
      renderApp();
    }

    /**
     * Toggles light/dark color theme.
     */
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    /**
     * Updates header navigation active underline & language button states.
     */
    function updateHeaderState() {
      const t = DATA[currentLang].nav;

      document.querySelectorAll('.nav-link').forEach((link) => {
        const route = link.getAttribute('data-route');
        if (t[route]) {
          link.textContent = t[route];
        }
        const isActive = route === currentRoute;
        if (isActive) {
          link.classList.add('border-cobalt', 'dark:border-blue-400', 'text-ink', 'dark:text-stone-100', 'font-medium');
          link.classList.remove('border-transparent', 'text-muted', 'dark:text-stone-400');
        } else {
          link.classList.remove('border-cobalt', 'dark:border-blue-400', 'text-ink', 'dark:text-stone-100', 'font-medium');
          link.classList.add('border-transparent', 'text-muted', 'dark:text-stone-400', 'hover:text-ink', 'dark:hover:text-stone-200');
        }
      });

      document.querySelectorAll('.lang-btn-en').forEach((btn) => {
        if (currentLang === 'en') {
          btn.classList.add('text-ink', 'dark:text-stone-100', 'font-semibold', 'underline', 'underline-offset-4');
        } else {
          btn.classList.remove('text-ink', 'dark:text-stone-100', 'font-semibold', 'underline', 'underline-offset-4');
        }
      });

      document.querySelectorAll('.lang-btn-fr').forEach((btn) => {
        if (currentLang === 'fr') {
          btn.classList.add('text-ink', 'dark:text-stone-100', 'font-semibold', 'underline', 'underline-offset-4');
        } else {
          btn.classList.remove('text-ink', 'dark:text-stone-100', 'font-semibold', 'underline', 'underline-offset-4');
        }
      });
    }

                <a href="https://linkedin.com/in/aimine-meddeb-a2b352248/" target="_blank" rel="noopener noreferrer" class="font-mono text-sm text-cobalt dark:text-blue-400 editorial-link">
                  linkedin.com/in/aimine-meddeb-a2b352248
                </a>
              </dd>
            </div>
          </dl>
        </div>
      `;
    }

    /**
     * Master render controller for the active route and language.
     */
    function renderApp() {
      updateHeaderState();
      const container = document.getElementById('app-view');

      switch (currentRoute) {
        case 'projects':
          container.innerHTML = renderProjectsPage();
          break;
        case 'experience':
          container.innerHTML = renderExperiencePage();
          break;
        case 'education':
          container.innerHTML = renderEducationPage();
          break;
        case 'contact':
          container.innerHTML = renderContactPage();
          break;
        case 'overview':
        default:
          container.innerHTML = renderOverviewPage();
          break;
      }
    }

    /**
     * Copies assembled email address safely without relying on blocked clipboard permissions.
     */
    function copyEmail() {
      const textarea = document.createElement('textarea');
      textarea.value = getAssembledEmail();
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast(DATA[currentLang].contactPage.copiedToast);
      } catch (err) {
        console.error('Copy failed', err);
      }
      document.body.removeChild(textarea);
    }

    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.remove('translate-y-3', 'opacity-0', 'pointer-events-none');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('translate-y-3', 'opacity-0', 'pointer-events-none');
      }, 2200);
    }

    // Handle browser Back / Forward buttons
    window.addEventListener('hashchange', () => {
      currentRoute = getRouteFromHash();
      renderApp();
    });

    // Initialize route and render on load
    document.addEventListener('DOMContentLoaded', () => {
      currentRoute = getRouteFromHash();
      renderApp();
    });
  </script>
</body>
</html>
